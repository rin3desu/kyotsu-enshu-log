<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5ed">
<title>共テ演習ログ</title>
<style>
:root{color-scheme:light;--paper:#f5f5ed;--ink:#182b25;--muted:#53655c;--accent:#225944;--line:#dce3d8;--white:#fffefa;--mint:#dff0df;--red:#932e34}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Inter","Hiragino Sans","Yu Gothic",system-ui,sans-serif}button,select,input{font:inherit}button,select,a{touch-action:manipulation}button,a,select{outline-offset:4px}button{cursor:pointer}a{color:var(--accent)}button:disabled{opacity:.5;cursor:default}
header{border-bottom:1px solid var(--line);background:var(--white)}.top,main{max-width:1152px;margin:auto;padding-inline:clamp(16px,4vw,48px)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:70px;flex-wrap:wrap}.brand{font-size:19px;font-weight:800;letter-spacing:-.035em;display:flex;gap:10px;align-items:center}.logo{background:var(--accent);color:white;border-radius:11px;width:34px;height:34px;display:grid;place-items:center}
nav{display:flex;gap:4px}button,.action{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:10px;padding:8px 13px;min-height:44px;font-weight:700}.action{text-decoration:none;display:inline-flex;align-items:center}nav button{border-color:transparent;background:transparent}nav button[aria-current=page]{background:var(--mint);color:var(--accent)}
main{padding-block:30px 56px}.hero{background:#173d30;color:#f9fff4;padding:clamp(23px,4vw,44px);border-radius:24px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:250px;height:250px;border:1px solid #ffffff25;border-radius:35%;right:-60px;bottom:-154px;transform:rotate(30deg);box-shadow:0 0 0 30px #ffffff0c,0 0 0 60px #ffffff08;pointer-events:none}.hero p{margin:0;color:#d3e6d9}.hero h1{margin:3px 0 8px;font-size:clamp(28px,5vw,47px);line-height:1.25;letter-spacing:-.045em}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 22px}.stat,.card{background:var(--white);border:1px solid var(--line);border-radius:17px;padding:18px}.stat span,.muted,small{color:var(--muted)}.stat strong{display:block;font-size:clamp(22px,4vw,32px);line-height:1.3}.layout{display:grid;grid-template-columns:1.9fr 1fr;gap:18px;align-items:start}.card h2{margin:0 0 10px;font-size:21px}.card p{margin:6px 0 12px}.fields,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.fields label{flex:1;min-width:115px;font-weight:700}.fields select{display:block;width:100%;min-height:45px;margin-top:4px;border:1px solid var(--line);border-radius:9px;background:var(--white);color:var(--ink);padding:5px 9px;font-size:16px}.block{border-top:1px solid var(--line);padding:12px 0}.block h3{font-size:15px;margin:0 0 8px}.block small{display:block;font-weight:400}.question{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ecede7;padding:5px 0;gap:8px}.question span{font-size:14px}.choices{display:flex;gap:5px;flex:none}.choices button{min-width:44px;padding:4px 8px}.choices [aria-pressed=true][data-value=c]{background:#dcefe2;border-color:#98bb9e;color:#10552d}.choices [aria-pressed=true][data-value=w]{background:#f9e3df;border-color:#e8b4b1;color:var(--red)}.choices [aria-pressed=true][data-value=u]{background:#edf0eb}.primary{background:var(--accent);color:white;border-color:var(--accent)}.savebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}.savebar span{flex:1}.side{display:grid;gap:14px}.side a{margin-bottom:4px}.topic{padding:12px 0;border-top:1px solid var(--line)}.topic b{display:flex;justify-content:space-between;gap:8px}.meter{height:7px;border-radius:10px;background:#e9eee7;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:#4d8969}.entry{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 0}.entry p{margin:0}details{margin:8px 0}summary{cursor:pointer;font-weight:700}.feedback{min-height:1.7em;color:var(--accent);font-weight:700}.error{color:var(--red)}[hidden]{display:none!important}
@media(max-width:740px){.layout{grid-template-columns:1fr}.top{padding-block:8px;min-height:auto}.stats{gap:7px}.stat{padding:10px}.card{padding:15px}}@media(max-width:365px){nav button{padding-inline:8px}.stat span{font-size:12px}}

.selectors{display:grid;grid-template-columns:.75fr 1.5fr 1.05fr;gap:9px;align-items:end}
.selectors label{min-width:0}.major-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(2,minmax(62px,85px));align-items:end;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.major-row input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:var(--white);color:var(--ink);font-size:16px}.major-row label{display:block;font-size:13px}.major-row label small{display:block}.major-row [aria-invalid=true]{border-color:var(--red)}
.major-row .row-title{align-self:center}.major-row .row-title span{display:block;font-weight:700}.major-list{margin:7px 0 14px}.major-list li{padding:3px 0}.entry details{flex-basis:100%;margin:0}.entry .actions{margin-left:auto}.inline-tools{margin:10px 0}.compact{font-size:13px}
@media(max-width:740px){.selectors{grid-template-columns:1fr 1fr}.selectors label:last-child{grid-column:1/-1}}

.major-row{grid-template-columns:minmax(0,1fr) repeat(3,minmax(60px,80px))}
.major-row .answer-panel{grid-column:1/-1;margin:2px 0 0}
.answer-panel>summary{color:var(--accent);min-height:30px;padding-top:3px}
.answer-panel .answer-add{margin-block:8px}.answer-add label{flex:1;min-width:140px}.answer-add button{align-self:end}
.answer-panel .question span{overflow-wrap:anywhere}.answer-panel .question .remove-answer{min-height:44px;font-weight:400;color:var(--muted)}
.answer-hint{font-size:13px;color:var(--muted);margin:2px 0 8px}
.major-row input:disabled{background:#eef0e9;color:var(--muted);opacity:1}
.score-line{display:block;font-weight:750;color:var(--accent)}
@media(max-width:520px){.major-row{grid-template-columns:repeat(3,minmax(0,1fr))}.major-row .row-title{grid-column:1/-1}.choices button{min-width:39px}}
nav{flex-wrap:wrap}
.checklist-card{min-width:0}
.checklist-scroll{max-width:100%;overflow-x:auto;border-left:1px solid #000;overscroll-behavior-inline:contain}
.checklist-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;color:#161616;font-size:13px;font-variant-numeric:tabular-nums;text-align:center}
.checklist-table th,.checklist-table td{border-right:1px solid #000;border-bottom:1px solid #000;padding:7px 6px;min-width:54px;white-space:nowrap}
.checklist-table thead tr:first-child th{border-top:1px solid #000;background:#173d30;color:#fff}
.checklist-table thead tr:nth-child(2) th,.checklist-table tbody th{background:#36705c;color:#fff}
.checklist-table th[scope=row],.checklist-table .checklist-corner{position:sticky;left:0;z-index:1;min-width:105px;padding-inline:9px;text-align:left}
.checklist-table .checklist-done{background:#dcefff;font-weight:700}
.checklist-table .checklist-unavailable{color:#68756e}
.checklist-table th small{display:block;color:inherit;line-height:1.25}
.checklist-note{font-size:13px;color:var(--muted)}
@media(max-width:520px){nav button{padding-inline:8px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand"><span class="logo" aria-hidden="true">✓</span>共テ演習ログ</div><nav aria-label="画面切り替え"><button data-view="record" aria-current="page">記録</button><button data-view="analysis">単元分析</button><button data-view="history">履歴</button><button data-view="checklist">演習チェック</button></nav></div></header>
<main>
<section class="hero"><p>共通テスト・センター試験</p><h1 id="heading">演習を記録する</h1><p id="subtitle">年度と科目を選び、採点結果を入力しましょう。</p></section>
<div class="stats" id="stats"></div>
<div id="feedback" class="feedback" role="status" aria-live="polite"></div>
<section class="layout" id="record">
<div class="card"><h2>演習の採点</h2><div class="fields selectors"><label>年度<select id="year"></select></label><label>試験<select id="sitting"></select></label><label>科目<select id="subject"></select></label></div>
<p class="muted" id="instructions"></p><div id="questions"></div><div class="actions inline-tools"><button id="addMajor" class="compact">大問を追加</button><button id="removeMajor" class="compact">末尾の大問を外す</button></div>
<div class="savebar"><span id="progress"></span><button class="primary" id="save">演習を保存</button></div>
</div>
<aside class="side"><div class="card"><h2>問題・解答を見る</h2><div class="fields"><label>大問<select id="major"></select></label></div><p id="referenceTopic"></p><div class="actions" id="resources"></div></div><div class="card"><h2>直近の演習</h2><div id="recent"></div></div><div class="card"><h2>選択中の試験の大問別集計</h2><div id="examStats"></div></div></aside>
</section>
<section id="analysis" class="layout" hidden><div class="card"><h2>単元別の正答率</h2><div class="fields"><label>科目で絞り込む<select id="filter"></select></label></div><p class="muted">正答率が低い順。単元を特定できる解答を集計します。</p><div id="topics"></div></div><aside class="card"><h2>復習の提案</h2><div id="advice"></div></aside></section>
<section id="history" class="layout" hidden><div class="card"><h2>演習履歴</h2><div id="entries"></div></div><aside class="card"><h2>記録のバックアップ</h2><p class="muted">記録はこのブラウザに保存されます。PCとiPhoneの間で移すには、書き出したファイルをもう一方の端末で読み込んでください。</p><div class="actions"><button id="export">書き出す</button><button id="import">読み込む</button><input id="file" type="file" accept=".json,application/json" hidden></div></aside></section>
<section id="checklist" class="card checklist-card" aria-label="過去問の演習チェック表" hidden><div id="exerciseChecklist"></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const node = (tag, value, className) => {
  const element = document.createElement(tag);
  if (value !== undefined) element.textContent = value;
  if (className) element.className = className;
  return element;
};
const button = (label, fn) => {
  const item = node('button', label);
  item.addEventListener('click', fn);
  return item;
};
const link = (label, href) => {
  const item = node('a', label, 'action');
  item.href = href;
  item.target = '_blank';
  item.rel = 'noopener noreferrer';
  return item;
};
const options = (element, items) => {
  element.replaceChildren(...items.map(([value, label]) => new Option(label,value)));
};
const storageKey = 'kyote-enshu-log-v1';
let records = [];
let form, majorDraft = [], editId = null, view = 'record';
const formatExam = exam => exam.year + '年度 ' + exam.sittingLabel + ' · ' + exam.subject;

function notify(message, error = false) {
  $('feedback').textContent = message;
  $('feedback').classList.toggle('error', error);
}
function persist(next) {
  if (globalThis.hostedClassroom) return globalThis.classroomSave(next);
  try {
    localStorage.setItem(storageKey, JSON.stringify(next));
    records = next;
    refresh();
    return true;
  } catch {
    notify('保存できませんでした。ブラウザの保存設定や空き容量を確認してください。', true);
    return false;
  }
}
function onPersist(result, success) {
  if (typeof result === 'boolean') {
    if (result) success();
  } else {
    result.then(saved => { if (saved) success(); });
  }
}
function countRecord(entry) {
  if (!entry.breakdown) return count(entry.marks);
  return entry.breakdown.reduce((sum,row) => ({
    total:sum.total+row.right+row.wrong, right:sum.right+row.right
  }), {total:0,right:0});
}
function count(marks) {
  const values = Object.values(marks);
  return { total: values.length, right: values.filter(value => value === 'c').length };
}
const percentage = (right, total) => total ? Math.round(right / total * 100) + '%' : '—';
const byDate = () => [...records].sort((a,b) => b.at.localeCompare(a.at));
function show(next) {
  view = next;
  for (const section of ['record','analysis','history','checklist']) $(section).hidden = section !== next;
  for (const tab of document.querySelectorAll('[data-view]')) {
    if (tab.dataset.view === next) tab.setAttribute('aria-current','page');
    else tab.removeAttribute('aria-current');
  }
  const copy = {
    record:['演習を記録する','年度と科目を選び、採点結果を入力しましょう。'],
    analysis:['苦手な単元を見つける','正答率と解いた数を見比べ、復習する単元を決めましょう。'],
    history:['演習を振り返る','取り組んだ年度・科目を確認し、記録の修正やバックアップができます。'],
    checklist:['過去問の演習チェック','科目ごとに、演習した年度と試験を確認できます。']
  };
  [$('heading').textContent, $('subtitle').textContent] = copy[next];
  notify('');
  refresh();
}

function listSittings(preferred) {
  const year = Number($('year').value);
  const prefix = year >= 2021 ? 'common-' : 'center-';
  options($('sitting'), ['main','makeup'].map(phase => {
    const id = prefix + phase;
    return [id,sittingLabel(year,id)];
  }));
  if (preferred?.endsWith('-makeup')) $('sitting').value = prefix + 'makeup';
}
function listSubjects(preferred) {
  const available = forms.filter(item => item.year === Number($('year').value) && item.sitting === $('sitting').value);
  options($('subject'), available.map(item => [item.id,item.subject]));
  const choice = available.find(item => item.id === preferred) || available.find(item => item.family === preferred);
  if (choice) $('subject').value = choice.id;
}
function loadForm() {
  form = forms.find(item => item.id === $('subject').value);
  majorDraft = defaultMajors(form);
  editId = null;
  notify('');
  renderForm();
  renderExamStats();
}

const answerLimit = 200;
function legacyPresetAnswers(exam,major) {
  return exam.groups.filter(group=>group.major===major).flatMap(group =>
    group.items.map(item=>({id:item.id,label:item.label,mark:'',detail:item.detail || group.topic})));
}
function presetAnswers(exam,major) {
  const legacy = legacyPresetAnswers(exam,major);
  const labels = exam.answerLabels?.[major-1];
  if (!labels) return legacy;
  const existing = new Map(legacy.map(answer=>[answer.id,answer]));
  return labels.map(value=>{
    const id = major+'-'+value;
    const detail = exam.majors.find(row=>row.major===major)?.geography?.answers?.[value]?.focus;
    return existing.get(id) || {id,label:typeof value==='number' ? '解答番号 '+value : value,mark:'',detail};
  });
}
const answerKey = label => label.replace(/^解答番号 /,'');
function makeMajor(exam,major) {
  const entry = exam.majors.find(item=>item.major===major);
  return {major,label:entry?.label || '',optional:entry?.optional || false,right:'',wrong:'',point:'',
    topic:'',answers:presetAnswers(exam,major),expanded:presetAnswers(exam,major).length>0};
}
function defaultMajors(exam) {
  return exam.majors.map(row=>makeMajor(exam,row.major));
}
function rowHasData(row) {
  return row.right !== '' || row.wrong !== '' || row.point !== '' ||
    Boolean(row.topic.trim()) || row.answers.some(answer=>answer.mark || !answer.id);
}
function hasDraft() {
  return majorDraft.some(rowHasData);
}
function changeExam() {
  if (hasDraft() && !confirm('現在の入力を破棄して、試験を切り替えますか？')) {
    $('year').value = String(form.year);
    listSittings(form.sitting);
    listSubjects(form.id);
    return;
  }
  const selected = forms.find(item => item.id === $('subject').value);
  const sitting = $('sitting').value;
  listSittings(sitting);
  const preferred = selected?.year === Number($('year').value) && selected.sitting === $('sitting').value
    ? selected.id
    : form.family;
  listSubjects(preferred);
  loadForm();
}
function validCount(value) {
  return value === '' || (/^\d{1,3}$/.test(String(value)) && Number(value) <= 999);
}

function answerCounts(answers) {
  const right = answers.filter(answer=>answer.mark==='c').length;
  const wrong = answers.filter(answer=>answer.mark==='w').length;
  return {right,wrong};
}
function readBreakdown() {
  const rows = [];
  for (const row of majorDraft) {
    const answers = row.answers.filter(answer=>answer.mark).map(({id,label,mark})=>({
      label,mark,...(id ? {id} : {})
    }));
    if (!validCount(row.point) || (!answers.length && (!validCount(row.right) || !validCount(row.wrong)))) return null;
    const {right,wrong} = answers.length ? answerCounts(answers) : {right:Number(row.right),wrong:Number(row.wrong)};
    if (!right && !wrong && row.point === '') continue;
    rows.push({
      major:row.major,right,wrong,
      ...(row.point !== '' ? {point:Number(row.point)} : {}),
      ...(row.topic.trim() ? {topic:row.topic.trim()} : {}),
      ...(answers.length ? {answers} : {})
    });
  }
  return rows;
}
function scoreInfo(rows) {
  let total=0, entered=0;
  for (const row of rows) if (Number.isInteger(row.point)) {
    total += row.point;
    entered++;
  }
  return {total,entered};
}
function scoreLabel(rows) {
  const score = scoreInfo(rows);
  if (!score.entered) return '得点未入力';
  return '入力した得点の合計 ' + score.total + '点（' + score.entered + '大問）';
}
function renderChecklist(container,attempts) {
  const sittings = ['common-main','common-makeup','center-main','center-makeup'];
  const columnsBySitting = sittings.map(sitting => [...new Set(forms.filter(exam=>exam.sitting===sitting)
    .map(exam=>exam.year))].sort((first,second)=>second-first).map(year=>({sitting,year})));
  const columns = columnsBySitting.flat();
  const exams = new Map(forms.map(exam=>[[exam.kind,exam.sitting,exam.year].join('/'),exam]));
  const latest = new Map();
  for (const attempt of attempts) {
    const previous = latest.get(attempt.formId);
    if (!previous || attempt.at > previous.at || (attempt.at === previous.at && attempt.updated > previous.updated)) {
      latest.set(attempt.formId,attempt);
    }
  }

  const table = node('table',undefined,'checklist-table');
  table.setAttribute('aria-label','科目・試験種別・年度ごとの演習状況');
  table.append(node('colgroup'));
  for (const group of columnsBySitting) {
    const columns = node('colgroup');
    columns.span = group.length;
    table.append(columns);
  }
  const head = node('thead');
  const groups = node('tr');
  const corner = node('th','科目','checklist-corner');
  corner.rowSpan = 2;
  groups.append(corner);
  for (const [index,sitting] of sittings.entries()) {
    const label = node('th',sittingLabel(columnsBySitting[index][0].year,sitting));
    label.colSpan = columnsBySitting[index].length;
    label.scope = 'colgroup';
    groups.append(label);
  }
  const years = node('tr');
  for (const {year,sitting} of columns) {
    const label = node('th',String(year));
    label.scope = 'col';
    if (year === 2021) label.append(node('small',sitting==='common-main' ? '第1日程' : '第2日程'));
    years.append(label);
  }
  head.append(groups,years);
  const body = node('tbody');
  const rowLabels = {
    ia:'数学Ⅰ・A',iib:'数学Ⅱ・B／B・C',phy:'物理',chem:'化学',geo:'地理',
    oldia:'旧数学Ⅰ・A',oldiib:'旧数学Ⅱ・B',oldgeo:'旧地理B'
  };
  for (const [kind] of subjects) {
    const row = node('tr');
    const subject = node('th',rowLabels[kind]);
    subject.scope = 'row';
    row.append(subject);
    for (const {year,sitting} of columns) {
      const exam = exams.get([kind,sitting,year].join('/'));
      const attempt = exam && latest.get(exam.id);
      const cell = node('td','-');
      if (attempt) {
        const score = scoreInfo(getMajorResults(attempt,exam));
        cell.className = 'checklist-done';
        cell.textContent = score.entered ? score.total+'点' : '得点未入力';
        cell.title = score.entered ? '得点を入力した '+score.entered+' 大問の合計' : '演習済み・得点未入力';
      } else if (!exam) {
        cell.className = 'checklist-unavailable';
        cell.title = '対象外';
        cell.setAttribute('aria-label','対象外');
      } else {
        cell.setAttribute('aria-label','未演習');
      }
      row.append(cell);
    }
    body.append(row);
  }
  table.append(head,body);
  const scroll = node('div',undefined,'checklist-scroll');
  scroll.tabIndex = 0;
  scroll.setAttribute('role','region');
  scroll.setAttribute('aria-label','年度別チェック表。横にスクロールできます');
  scroll.append(table);
  const note = node('p','薄い青は演習済み。直近の演習で入力した大問の得点を合計しています。表は横にスクロールできます。','checklist-note');
  container.replaceChildren(note,scroll);
}
function normalizeNumbers(value) {
  return value.replace(/[０-９]/g,c=>String(c.charCodeAt(0)-65296));
}
function labelsFromInput(value) {
  const chunks=normalizeNumbers(value).trim().split(/[、,，\s]+/).filter(Boolean);
  const labels=[];
  for (const chunk of chunks) {
    const range=chunk.match(/^(\d{1,3})[-–〜～](\d{1,3})$/);
    if (range) {
      const start=Number(range[1]), end=Number(range[2]);
      if (start<1 || end<start || end-start+1+labels.length>answerLimit) return null;
      for (let number=start;number<=end;number++) labels.push(String(number));
    } else {
      if (chunk.length>24 || labels.length===answerLimit) return null;
      labels.push(chunk);
    }
  }
  return [...new Set(labels)];
}
function numericField(row,key,label) {
  const field=node('label',label);
  const input=node('input');
  input.type='text';
  input.inputMode='numeric';
  input.maxLength=3;
  input.autocomplete='off';

function save() {
  const breakdown=readBreakdown();
  if (!breakdown?.length) return;
  const old = records.find(item => item.id === editId);
  const now = new Date().toISOString();
  const id = old?.id || globalThis.crypto?.randomUUID?.() || now + '-' + Math.random().toString(36).slice(2);
  const entry = {id, formId:form.id, at:old?.at || now, updated:now,breakdown};
  onPersist(persist([...records.filter(item => item.id !== id),entry]), () => {
    if (form.id === entry.formId) loadForm();

function edit(entry) {
  const target = forms.find(item => item.id === entry.formId);
  $('year').value = String(target.year);
  listSittings(target.sitting);
  listSubjects(target.id);
  form = target;
  const saved=getMajorResults(entry,form);
  const count=Math.max(form.majors.length,...saved.map(row=>row.major));
  majorDraft=Array.from({length:count},(_,index)=>{
    const row=makeMajor(form,index+1);
    const data=saved.find(item=>item.major===row.major);
    if (!data) return row;
    const answers=data.answers || [];
    if (!answers.length) {
      row.right=data.right ? String(data.right) : '';
      row.wrong=data.wrong ? String(data.wrong) : '';
    }
    row.point=data.point === undefined ? '' : String(data.point);
    row.topic=data.topic || '';
    for (const answer of answers) {
      const registered=row.answers.find(item=>answer.id ? item.id===answer.id : answerKey(item.label)===answerKey(answer.label));
      if (registered) registered.mark=answer.mark;
      else row.answers.push({...answer});

    row.expanded=answers.length>0;
    return row;
  });
  editId = entry.id;

function getMajorResults(entry, exam) {
  if (entry.breakdown) return entry.breakdown;
  const totals = new Map();
  for (const group of exam.groups) {
    for (const item of group.items) {
      const mark = entry.marks[item.id];
      if (!mark) continue;
      const row = totals.get(group.major) || {major:group.major,right:0,wrong:0,answers:[]};
      row.answers.push({id:item.id,label:item.label,mark});
      row[mark === 'c' ? 'right' : 'wrong']++;
      totals.set(group.major,row);
    }
  }
  return [...totals.values()];
}

function aggregate() {
  const result = new Map();
  for (const entry of records) {
    const exam=forms.find(item=>item.id===entry.formId);
    if ($('filter').value && $('filter').value!==exam.family) continue;
    const add=(topic,right,wrong,detail,geoSource)=>{
      if (!topic || right+wrong===0) return;
      const key=JSON.stringify([exam.family,topic]);
      const stat=result.get(key) || {topic,family:exam.family,total:0,right:0,errors:new Map(),geography:new Map()};
      stat.total+=right+wrong;
      stat.right+=right;
      if (detail && wrong) stat.errors.set(detail,(stat.errors.get(detail)||0)+wrong);
      if (detail && wrong && geoSource) stat.geography.set(detail,geoSource);
      result.set(key,stat);
    };
    for (const row of getMajorResults(entry,exam)) {
      const major=exam.majors.find(major=>major.major===row.major);
      const area=major?.geography;
      const topic=area?.topic || row.topic || major?.topic;
      if (!row.answers?.length) {
        add(topic,row.right,row.wrong,area?.focus,area?.source || (area && exam.source));
        continue;
      }
      const topicsById=new Map(exam.groups.filter(group=>group.major===row.major).flatMap(group=>
        group.items.map(item=>[item.id,{topic:item.topic || group.topic,detail:item.detail || group.detail}])));
      for (const answer of row.answers) {
        const preset=topicsById.get(answer.id);
        const geoQuestion=area?.answers?.[answerKey(answer.label).normalize('NFKC').trim()];
        add(geoQuestion?.topic || preset?.topic || topic,Number(answer.mark==='c'),Number(answer.mark==='w'),
          geoQuestion?.focus || preset?.detail || area?.focus,area?.source || (area && exam.source));
      }
    }
  }
  return [...result.values()].sort((a,b)=>a.right/a.total-b.right/b.total || b.total-a.total);
}

      : tips[stat.topic] || '間違えた問題の解説で判断の根拠を確認し、同じ単元の類題を1題、解説を見ずに解き直しましょう。';

function validateAnswers(row,exam) {
  if (row.answers===undefined) return undefined;
  const fail=()=>{throw new Error('解答欄データの形式が異なります');};
  if (!Array.isArray(row.answers) || !row.answers.length || row.answers.length>answerLimit) fail();
  const presets=new Map([...legacyPresetAnswers(exam,row.major), ...presetAnswers(exam,row.major)]
    .map(answer=>[answer.id,answer.label]));
  const labels=new Set();
  const answers=row.answers.map(answer=>{
    if (!answer || typeof answer.label!=='string' || !answer.label.trim() || answer.label.length>24 ||
        !['c','w'].includes(answer.mark) || (answer.id!==undefined && presets.get(answer.id)!==answer.label)) fail();
    const label=answer.label.trim();
    const key=answerKey(label);
    if (labels.has(key)) fail();
    labels.add(key);
    return {label,mark:answer.mark,...(answer.id ? {id:answer.id} : {})};
  });
  const counts=answerCounts(answers);
  if (counts.right!==row.right || counts.wrong!==row.wrong) fail();
  return answers;
}
function validate(entries) {
  if (!Array.isArray(entries)) throw new Error('形式が異なります');
  return entries.map(entry => {
    const exam = forms.find(item => item.id === entry?.formId);
    if (!exam || typeof entry.id !== 'string' || !entry.id || [entry.at,entry.updated].some(date => typeof date !== 'string' || !Number.isFinite(Date.parse(date))) ) throw new Error('記録の形式が異なります');
    if (entry.breakdown !== undefined) {
      if (!Array.isArray(entry.breakdown) || !entry.breakdown.length || entry.breakdown.length > 20) throw new Error('大問別データの形式が異なります');
      const majors = new Set();
      const breakdown = entry.breakdown.map(row => {
        if (!row || !Number.isInteger(row.major) || row.major < 1 || row.major > 20 ||
            majors.has(row.major) || [row.right,row.wrong].some(n => !Number.isInteger(n) || n < 0 || n > 999) ||
            (row.point !== undefined && (!Number.isInteger(row.point) || row.point < 0 || row.point > 999)) ||
            (row.right + row.wrong === 0 && row.point === undefined)) throw new Error('大問別データの形式が異なります');
        majors.add(row.major);
        if (row.topic !== undefined && (typeof row.topic !== 'string' || row.topic.length > 60)) throw new Error('単元の形式が異なります');
        const answers=validateAnswers(row,exam);
        return {
          major:row.major,right:row.right,wrong:row.wrong,
          ...(row.topic?.trim() ? {topic:row.topic.trim()} : {}),
          ...(row.point !== undefined ? {point:row.point} : {}),
          ...(answers ? {answers} : {})
        };
      }).sort((a,b)=>a.major-b.major);
      return {id:entry.id,formId:exam.id,at:new Date(entry.at).toISOString(),updated:new Date(entry.updated).toISOString(),breakdown};
    }
    if (!entry.marks || typeof entry.marks !== 'object' || Array.isArray(entry.marks)) throw new Error('記録の形式が異なります');
    const ids = new Set(exam.groups.flatMap(group => group.items.map(item => item.id)));
    const marks = Object.entries(entry.marks);
    if (!marks.length || marks.some(([id,value]) => !ids.has(id) || !['c','w'].includes(value))) throw new Error('解答データの形式が異なります');
    return {id:entry.id,formId:exam.id,at:new Date(entry.at).toISOString(),updated:new Date(entry.updated).toISOString(),marks:Object.fromEntries(marks)};
  });
}

  catch { notify('保存済みの記録を読み込めませんでした。バックアップがあれば履歴から読み込めます。',true); }
  refresh();
  for (const id of ['year','sitting','subject']) $(id).addEventListener('change',changeExam);
  $('addMajor').addEventListener('click',() => changeMajorCount(1));
  $('removeMajor').addEventListener('click',() => changeMajorCount(-1));
  $('major').addEventListener('change',renderReference);
  $('filter').addEventListener('change',renderAnalysis);
  $('save').addEventListener('click',save);
  for (const tab of document.querySelectorAll('[data-view]')) tab.addEventListener('click',() => show(tab.dataset.view));
  $('export').addEventListener('click',() => {
    const url = URL.createObjectURL(new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'}));
    const anchor = node('a');
    anchor.href = url;
    anchor.download = 'kyote-log-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url),30000);
  });
  $('import').addEventListener('click',() => $('file').click());
  $('file').addEventListener('change',async () => {
    const file = $('file').files[0];
    $('file').value = '';
    if (!file) return;
    try {
      const backup = JSON.parse(await file.text());
      if (backup.version !== 1) throw new Error('形式が異なります');
      const merged = new Map(records.map(item => [item.id,item]));
      for (const entry of validate(backup.records)) {
        if (!merged.has(entry.id) || merged.get(entry.id).updated < entry.updated) merged.set(entry.id,entry);
      }
      onPersist(persist([...merged.values()]), () => notify('バックアップを読み込みました。'));
    } catch {
      notify('読み込めませんでした。このアプリで書き出したJSONファイルを選んでください。',true);
    }
  });

  for (const phase of ['main','makeup']) {
    const sitting = (year>=2021 ? 'common-' : 'center-') + phase;
    for (const [kind,family,name] of subjects) {
      if (kind.startsWith('old') && year !== 2025) continue;
      const details = phase === 'main' ? detailedForms.find(exam => exam.id === year + '-' + kind) : null;
      const catalogKey = year + '-' + phase + '-' + kind;
      const info = catalog[catalogKey] || {};
      const id = phase === 'main' && year >= 2021 ? year + '-' + kind : year + '-' + sitting + '-' + kind;
      const firstOptional = year <= 2020 ? {ia:3,iib:3,phy:5,chem:6}[kind] : undefined;
      const rows = info.rows || Array.from({length:defaultMajorCount(year,kind)},(_,i)=>[
        i+1,'',firstOptional !== undefined && i+1 >= firstOptional
      ]);
      const majors = rows.map(([major,label,optional,verifiedTopic]) => {
        const geography = geographyAreas[catalogKey]?.[major];
        const blocks = details?.groups.filter(group => group.major===major) || [];
        const detailTopics = [...new Set(blocks.flatMap(group=>group.items.map(item=>item.topic || group.topic)))];
        const display = detailTopics.length === 1 ? detailTopics[0] : label || (blocks.length ? blocks.map(group=>group.topic).join('／') : '');
        const topic = detailTopics.length ? detailTopics.length === 1 ? detailTopics[0] : null :
          verifiedTopic === undefined ? primaryTopic(kind,display,major,year) : verifiedTopic;
        return {major,label:geography?.label || display,topic:geography?.topic || topic,geography,
          optional:kind==='oldiib' && major===4 ? false : optional,page:blocks[0]?.page};

        ...info,...details,id,kind,year,sitting,sittingLabel:sittingLabel(year,sitting),subject:name(year),family,majors,
